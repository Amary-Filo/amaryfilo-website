<section class="sc projects">
  <div class="container cl-project">
    <div class="cards">
      @for (project of projects(); track $index) {
      <div class="cd cd-pj bd-h bd-t btn-anm cd-bg fl fl-dc">
        <a
          class="link"
          [routerLinkWithLang]="['projects', project.slug]"
          [title]="'page.home.projects.open' | t : { title: project.title }"
        >
          <h2 class="title">{{ project.title }}</h2>
        </a>
        <p class="text t-ct op-7">
          {{ project.anonce }}
        </p>
        <a
          class="btn fill t-cw"
          [routerLinkWithLang]="['projects', project.slug]"
          [title]="'page.home.projects.open' | t : { title: project.title }"
        >
          {{ "page.home.projects.open.title" | t }}
        </a>
      </div>
      }
    </div>
    <div class="head-section fl-bc fl-dc hs-part">
      <h2 class="title ls-2 t-gr ls t-u cl-g-project">
        {{ "page.home.projects.title" | t }}
      </h2>
      <p class="text op-7 ls fw-b">
        {{ "page.home.projects.description" | t }}
      </p>
      <a
        class="cl-g-project btn g-bg w-base g-a"
        [routerLinkWithLang]="['projects']"
        [title]="'page.home.projects.button.title' | t"
      >
        {{ "page.home.projects.button" | t }}
      </a>
    </div>
  </div>
</section>
