<div class="sandbox-ui">
  <div class="benefit-item">
    <ui-icon [name]="icon()" [size]="iconSize()" />
    <ng-content select="[benefitContent]">
      <div class="benefit-item-info lh-none">
        <span class="text-secondary">{{ title() }}</span>
        <span class="title" [class.fz-sm]="isSmall()">{{ text() }}</span>
      </div>
    </ng-content>
  </div>
</div>
