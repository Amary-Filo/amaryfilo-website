<div class="controls cl-cmain">
  <h4 class="title fz-md">Settings</h4>

  <div class="field-set" [attr.data-title]="'Fields group'">
    <div class="check">
      <input
        class="checkbox"
        type="checkbox"
        id="author"
        name="author"
        [checked]="cfg?.showAuthor"
        (change)="toggleFlag('showAuthor')"
      />
      <label class="label op-7" for="author">Show author</label>
    </div>

    <div class="check">
      <input
        class="checkbox"
        type="checkbox"
        id="date"
        name="date"
        [checked]="cfg?.showDate"
        (change)="toggleFlag('showDate')"
      />
      <label class="label op-7" for="date">Show publish date</label>
    </div>

    <div class="check">
      <input
        class="checkbox"
        type="checkbox"
        id="description"
        name="description"
        [checked]="cfg?.showDescription"
        (change)="toggleFlag('showDescription')"
      />
      <label class="label op-7" for="description">Show description</label>
    </div>
  </div>

  <div class="field-set" [attr.data-title]="'Buttons Group'">
    <button class="btn" (click)="triggerAutoGenerate()">Generate a book</button>
  </div>
</div>
