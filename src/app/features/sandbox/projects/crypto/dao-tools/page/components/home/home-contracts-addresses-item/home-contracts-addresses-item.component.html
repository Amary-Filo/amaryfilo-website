<sbx-accordion-component
  class="sandbox-ui"
  [isSkeleton]="status() !== 'connected'"
  [content]="address"
  [text]="'Official contract address with verified status'"
>
  <div class="block-title" accordionHeadInfo>
    <span class="title">
      Contract address for
      <span
        [class]="`text-accent fill cl-${contractName.toLowerCase().replace('/','-')}`"
        >{{ contractName }}</span
      >
      Token
    </span>
  </div>

  <p class="text-secondary" accordionBottom>
    You can open this
    <span
      [class]="`text-accent cl-${contractName.toLowerCase().replace('/','-')}`"
    >
      {{ contractName }}</span
    >
    verified contract in Etherscan.
  </p>

  <ng-container accordionBottomButtons>
    <ui-button
      [isFilled]="true"
      [onlyIcon]="true"
      [leftIcon]="'externalLinkFill'"
      (click)="open()"
    />
  </ng-container>
</sbx-accordion-component>
