<div class="sandbox-ui">
  <div class="benefit-list">
    <ui-benefit-item
      icon="calendarScheduleFill"
      title="Date start"
      [text]="date()"
    />
    <ui-benefit-item icon="stackFill" title="Staked" [text]="staked()" />
    <ui-benefit-item icon="percentFill" title="Percents" [text]="percent()" />
    <ui-benefit-item icon="lineChartFill" title="You will get" [text]="get()" />
    <ui-benefit-item icon="historyFill" title="Time" [text]="choose()" />
  </div>
</div>
