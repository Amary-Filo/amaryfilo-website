<footer class="base-ui">
  <div class="container fl-cc fl-dc">
    <span class="logo ic-amaryfilo t-gr"></span>
    <div class="cleatfix"></div>
    <nav class="fl-cc">
      <a
        class="btn m"
        [title]="'menu.open' | t : { title: ('menu.about' | t) }"
        routerLinkWithLang="about"
        >{{ "menu.about" | t }}</a
      >
      <a
        class="btn m"
        [title]="'menu.open' | t : { title: ('menu.blog' | t) }"
        routerLinkWithLang="blog"
        >{{ "menu.blog" | t }}</a
      >
      <a
        class="btn m"
        [title]="'menu.open' | t : { title: ('menu.designs' | t) }"
        routerLinkWithLang="designs"
        >{{ "menu.designs" | t }}</a
      >
      <a
        class="btn m"
        [title]="'menu.open' | t : { title: ('menu.projects' | t) }"
        routerLinkWithLang="projects"
        >{{ "menu.projects" | t }}</a
      >
      <a
        class="btn m"
        [title]="'menu.open' | t : { title: ('menu.solutions' | t) }"
        routerLinkWithLang="solutions"
        >{{ "menu.solutions" | t }}</a
      >
      <a
        class="btn m"
        [title]="'menu.open' | t : { title: ('menu.sandbox' | t) }"
        routerLinkWithLang="sandbox"
        >{{ "menu.sandbox" | t }}</a
      >
    </nav>
    <div class="social-links fl fl-w">
      <app-social-links />
    </div>
    <div class="clearfix"></div>
    <b class="ft-creater ls">{{ "footer.copyrights" | t }}</b>
    <span class="ft-copyright">{{ "footer.rights" | t : { year } }}</span>
  </div>
</footer>
