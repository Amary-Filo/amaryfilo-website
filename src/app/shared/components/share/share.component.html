<section class="sc shr-b">
  <div class="container">
    <div class="cd-st">
      <div class="head-section fl-cc fl-dc h-mb">
        <h2 class="title ls-2 t-gr ls t-u cl-g-cmain">
          {{ "share.title" | t }}
        </h2>
        <p class="text op-7 ls fw-b">
          {{ "share.description" | t }}
        </p>
      </div>
      <div class="shr-b-l fl-cc">
        <a
          class="btn ic-twitter fill t-cw m"
          href="#"
          rel="nofollow norefferer"
          target="blank"
          [title]="'share.link' | t : { title: 'Twitter' }"
        ></a
        ><a
          class="btn ic-facebook fill t-cw m"
          href="#"
          rel="nofollow norefferer"
          target="blank"
          [title]="'share.link' | t : { title: 'Github' }"
        ></a
        ><a
          class="btn ic-telegram fill t-cw m"
          href="#"
          rel="nofollow norefferer"
          target="blank"
          [title]="'share.link' | t : { title: 'Behance' }"
        ></a
        ><a
          class="btn ic-linkedin fill t-cw m"
          href="#"
          rel="nofollow norefferer"
          target="blank"
          [title]="'share.link' | t : { title: 'Instagram' }"
        ></a>
      </div>
    </div>
  </div>
</section>
