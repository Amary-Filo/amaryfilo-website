<header class="base-ui" [class]="headerClass()">
  <div class="container">
    <span
      class="btn fz-md"
      [class]="'menu-bars btn fz-md ' + iconClass()"
      (click)="toggleMenu()"
      [title]="'menu.toggle' | t"
    ></span>
    <div class="header">
      <a
        class="fl-cc fl-dc ic-amaryfilo t-main fw-800"
        d-text="Amary Filo"
        routerLinkWithLang=""
        (click)="onNavClick()"
      ></a>
      <nav class="fl">
        <a
          class="btn m"
          [title]="'menu.open' | t : { title: ('menu.about' | t) }"
          routerLinkWithLang="about"
          (click)="onNavClick()"
          >{{ "menu.about" | t }}</a
        >
        <a
          class="btn m"
          [title]="'menu.open' | t : { title: ('menu.blog' | t) }"
          routerLinkWithLang="blog"
          (click)="onNavClick()"
          >{{ "menu.blog" | t }}</a
        >
        <a
          class="btn m"
          [title]="'menu.open' | t : { title: ('menu.designs' | t) }"
          routerLinkWithLang="designs"
          (click)="onNavClick()"
          >{{ "menu.designs" | t }}</a
        >
        <a
          class="btn m"
          [title]="'menu.open' | t : { title: ('menu.projects' | t) }"
          routerLinkWithLang="projects"
          (click)="onNavClick()"
          >{{ "menu.projects" | t }}</a
        >
        <a
          class="btn m"
          [title]="'menu.open' | t : { title: ('menu.solutions' | t) }"
          routerLinkWithLang="solutions"
          (click)="onNavClick()"
          >{{ "menu.solutions" | t }}</a
        >
        <a
          class="btn m"
          [title]="'menu.open' | t : { title: ('menu.sandbox' | t) }"
          routerLinkWithLang="sandbox"
          (click)="onNavClick()"
          >{{ "menu.sandbox" | t }}</a
        >
      </nav>
      <div class="fl header-btns">
        <div class="fl">
          <button
            class="lang m btn ic-globe t"
            type="button"
            (click)="openLangModal()"
          >
            {{ currentLangName() }}
          </button>
          <span
            [class]="
              'theme-color m btn ic-' +
              (theme.theme() === 'dark' ? 'moon' : 'light-up')
            "
            (click)="theme.toggle()"
            [attr.title]="
              theme.theme() === 'dark'
                ? ('menu.theme.light' | t)
                : ('menu.theme.dark' | t)
            "
          >
          </span>
        </div>
      </div>
    </div>
  </div>
</header>

@if (langModalOpen()) {
<section class="modal-opened base-ui">
  <div class="modal fl-cc fl-dc" id="modal-lang">
    <div (click)="closeLangModal()" class="backdrop"></div>
    <div class="modal-wrap">
      <button
        (click)="closeLangModal()"
        [attr.aria-label]="'menu.modal.close' | t"
        class="modal-close btn ic-cancel-1 link-hover"
      ></button>
      <div class="modal-top">
        <h2 class="title fz-xxl cl-amaryfilo t-gr">
          {{ "menu.modal.title" | t }}
        </h2>
        <p class="text op-6">
          {{ "menu.modal.description" | t }}
        </p>
        <div class="clearfix"></div>
      </div>
      <div class="modal-content">
        <div class="modal-lang">
          @for (l of langs; track l) {
          <button
            class="btn w-100"
            [class.active]="l === langSvc.current"
            (click)="pickLang(l)"
          >
            {{ langNames[l] || l.toUpperCase() }}
          </button>
          }
        </div>
      </div>
      <div class="modal-bottom"></div>
    </div>
  </div>
</section>
}
