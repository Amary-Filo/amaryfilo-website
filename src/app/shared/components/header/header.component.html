<header [class]="headerClass()">
  <div class="container">
    <span
      class="btn fz-md"
      [class]="'menu-bars btn fz-md ' + iconClass()"
      (click)="toggleMenu()"
      title="Toggle menu"
    ></span>
    <div class="header">
      <a
        class="fl-cc fl-dc ic-amaryfilo t-main fw-800"
        d-text="Amary Filo"
        routerLinkWithLang=""
        (click)="onNavClick()"
      ></a>
      <nav class="fl">
        <a
          class="btn m"
          title="Open About page"
          routerLinkWithLang="about"
          (click)="onNavClick()"
          >About</a
        >
        <a
          class="btn m"
          title="Open Blog page"
          routerLinkWithLang="blog"
          (click)="onNavClick()"
          >Blog</a
        >
        <a
          class="btn m"
          title="Open Design page"
          routerLinkWithLang="designs"
          (click)="onNavClick()"
          >Design</a
        >
        <a
          class="btn m"
          title="Open Projects page"
          routerLinkWithLang="projects"
          (click)="onNavClick()"
          >Projects</a
        >
        <a
          class="btn m"
          title="Open Solutions page"
          routerLinkWithLang="solutions"
          (click)="onNavClick()"
          >Solutions</a
        >
        <a
          class="btn m"
          title="Open Sandbox page"
          routerLinkWithLang="sandbox"
          (click)="onNavClick()"
          >Sandbox</a
        >
      </nav>
      <div class="fl header-btns">
        <div class="fl">
          <button
            class="lang m btn ic-globe t"
            type="button"
            (click)="openLangModal()"
          >
            {{ currentLangName() }}
          </button>
          <span
            [class]="
              'theme-color m btn ic-' +
              (theme.theme() === 'dark' ? 'moon' : 'light-up')
            "
            (click)="theme.toggle()"
            [attr.title]="
              theme.theme() === 'dark' ? 'Light theme' : 'Dark theme'
            "
          >
          </span>
        </div>
      </div>
    </div>
  </div>
</header>

<!-- Простая модалка выбора языка -->
@if (langModalOpen()) {
<div class="modal fl-cc fl-dc" id="modal-lang">
  <div (click)="closeLangModal()" class="backdrop"></div>
  <div class="modal-wrap">
    <button
      (click)="closeLangModal()"
      aria-label="Close"
      class="modal-close btn ic-cancel-1 link-hover"
    ></button>
    <div class="modal-top">
      <h2 class="title fz-xxl cl-amaryfilo t-gr">Choose language</h2>
      <p class="text op-6">
        Website have different languages that must help you to understand
        content in your native language for best experience.
      </p>
      <div class="clearfix"></div>
    </div>
    <div class="modal-content">
      <div class="modal-lang">
        @for (l of langs; track l) {
        <button
          class="btn w-100"
          [class.active]="l === langSvc.current"
          (click)="pickLang(l)"
        >
          {{ langNames[l] || l.toUpperCase() }}
        </button>
        }
      </div>
    </div>
    <div class="modal-bottom"></div>
  </div>
</div>
}
