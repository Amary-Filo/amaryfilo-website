<img [src]="item().img" [alt]="item().title" />
<div class="info">
  <div class="title">{{ item().title }}</div>
  <p class="text">{{ item().text }}</p>

  <div class="btns">
    <button ui-button (click)="openDialog()">View summary</button>

    @if (item().liveUrl) {
      <button ui-button variant="secondary" [routerLink]="'/demos/' + item().slug">
        Open Demo
      </button>
    }

    @if (item().link) {
      <a
        ui-button
        icon="arrowRightUpLine"
        variant="secondary"
        [href]="item().link"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Open Demo"
      >
        Open Demo
      </a>
    }

    @if (item().code) {
      <a
        ui-button
        icon="arrowRightUpLine"
        variant="secondary"
        [href]="item().code"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View Code"
      >
        View Code
      </a>
    }
  </div>
</div>
