<span class="eyebrow" [hidden]="!item().company">{{ item().company }}</span>

<h4 class="title">{{ item().title }}</h4>

<div class="meta" [hidden]="variant() !== 'full'">
  <span [hidden]="!item().period">{{ item().period }}</span>
  <span [hidden]="!item().location">{{ item().location }}</span>
</div>

<p class="text">{{ item().summary }}</p>

<ul class="bullets" [hidden]="variant() !== 'full' && item().bullets?.length">
  @for (bullet of item().bullets; track $index) {
    <li>{{ bullet }}</li>
  }
</ul>
