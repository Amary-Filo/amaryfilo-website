<section class="u-container">
  <div class="u-section-head">
    <h2 class="ui-text-heading-1">Technical Profile</h2>
    <p class="text ui-text-paragraph-extra-large-medium u-text-muted">
      The core technologies and domains I work with daily.
    </p>
  </div>

  <div class="list">
    @for (item of list; track $index; let last = $last) {
      <div class="item">
        <div class="title">{{ item.title }}</div>
        <p class="text">{{ item.text }}</p>
      </div>

      @if (!last) {
        <div ui-separator></div>
      }
    }
  </div>
</section>
